# Local PostgreSQL for Arogya (source of truth for the RAG pipeline).
# Usage:  docker compose up -d      (reads POSTGRES_PASSWORD from ./.env — never committed)
services:
  postgres:
    image: postgres:16-alpine
    container_name: arogya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: arogya_rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    ports:
      - "5432:5432"
    volumes:
      - arogya_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d arogya_rag"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  arogya_pgdata:
    name: arogya_pgdata
