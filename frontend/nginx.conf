server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 20m;

    # All API calls go to the backend container (same origin for the browser).
    location /api/ {
        proxy_pass http://backend:8010;
        proxy_set_header Host $host;
        proxy_read_timeout 1200s;   # live benchmark runs ~9 min on CPU
        proxy_send_timeout 1200s;
    }

    # SPA routes: /, /ai-analysis, /emergency
    location / {
        try_files $uri /index.html;
    }
}
